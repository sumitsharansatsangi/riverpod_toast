name: riverpod_toast
description: A Riverpod-based toast notification system with overlay support, localization, and adaptive theming.
version: 0.1.0
homepage: https://www.kumpali.com
repository: https://github.com/sumitsharansatsangi/riverpod_toast/
changelog: CHANGELOG.md
topics:
  - toast
  - snackbar
  - riverpod
  - riverpod-toast
  - notification

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_styled_toast: ^2.2.1
  easy_localization: ^3.0.8
  riverpod_annotation: ^3.0.0

dev_dependencies:
  build_runner: any
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0